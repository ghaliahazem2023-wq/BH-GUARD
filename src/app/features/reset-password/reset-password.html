<div class="reset-box">
  <h2>Réinitialisation du mot de passe</h2>
  <p>Veuillez confirmer votre identité pour changer le mot de passe.</p>

  <form (ngSubmit)="onReset()">
    <div class="form-group">
      <label>Nom d'utilisateur (Username)</label>
      <input type="text" [(ngModel)]="resetData.username" name="username" placeholder="Entrez votre username" required>
    </div>

    <div class="form-group">
      <label>Votre Fonction</label>
      <select [(ngModel)]="resetData.fonction" name="fonction">
        <option value="ADMINISTRATEUR">ADMINISTRATEUR</option>
        <option value="AGENT_ANTI_FRAUDE">AGENT_ANTI_FRAUDE</option>
      </select>
    </div>

    <div class="form-group">
      <label>Nouveau Mot de Passe</label>
      <input type="password" [(ngModel)]="resetData.newPassword" name="newPassword" placeholder="Nouveau mot de passe" required>
    </div>

    <button type="submit" class="btn-update">Mettre à jour le mot de passe</button>
  </form>
</div>
